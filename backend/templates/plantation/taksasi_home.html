{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Required header -->
    <link
      href="{% static 'assets/css/bootstrap/bootstrap.css' %}"
      rel="stylesheet"
    />
    <link
      href="{% static 'assets/js/leaflet/leaflet.css' %}"
      rel="stylesheet"
    />

    <title>Hectare Statement</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        border: 0;
        width: 100%;
      }

      header {
        height: 100px; /* Set header height to 100px */
        display: flex;
        align-items: center; /* Center content vertically */
      }

      content {
        height: 980px;
      }

      #map {
        height: 820px;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid p-0">
      {% include 'widget/navbar.html' %}

      <content>
        <div id="map"></div>
      </content>
    </div>

    <!-- Required JS -->
    <script src="{% static 'assets/js/leaflet/leaflet.js' %}"></script>
    <script src="{% static 'assets/js/jquery/jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'assets/js/popper/popper.min.js' %}"></script>
    <script src="{% static 'assets/js/bootstrap/bootstrap.js' %}"></script>

    <script>
      // Initialize Leaflet map
      var map = L.map('map').setView([-2.5, 118], 5); // Centered on Indonesia

      // Add OpenStreetMap basemap
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map);

      // Get GeoJSON string safely; if undefined, use "null"
      var geojsonStr = '{{ geojson|escapejs }}';

      if (geojsonStr && geojsonStr !== 'null') {
        try {
          var geojsonData = JSON.parse(geojsonStr);

          // Add GeoJSON layer to map
          L.geoJSON(geojsonData, {
            style: function (feature) {
              return { color: 'blue', weight: 2, fillOpacity: 0.3 };
            },
            onEachFeature: function (feature, layer) {
              if (feature.properties) {
                var popupContent =
                  '<b>Plot ID:</b> ' +
                  feature.properties.plot_id +
                  '<br>' +
                  '<b>Luas:</b> ' +
                  feature.properties.luas +
                  '<br>' +
                  '<b>TCH:</b> ' +
                  feature.properties.tch +
                  '<br>' +
                  '<b>Tonase:</b> ' +
                  feature.properties.tonase;
                layer.bindPopup(popupContent);
              }
            },
          }).addTo(map);
        } catch (e) {
          console.error('Error parsing geojson data: ', e);
        }
      } else {
        console.error('GeoJSON data is not defined or empty.');
      }
    </script>
  </body>
</html>
